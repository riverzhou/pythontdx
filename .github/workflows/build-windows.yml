name: build-windows-x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Build Windows setup + portable
        run: |
          npm run build:python
          npm run build
          npx electron-builder --win --publish never

      - name: Sign Windows (self-signed, best effort)
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/sign-win.ps1

      - name: Create and verify green zip
        shell: powershell
        run: npm run build:win:zip

      - name: Checksums and certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $release = Join-Path $PWD "release/$version"
          Get-ChildItem $release -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$($_.Name) $hash"
          }
          if (Test-Path "$release/pythontdx-selfsigned.cer") {
            Copy-Item "$release/pythontdx-selfsigned.cer" "$release/pythontdx-selfsigned.cer.txt"
          }

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "tag/package version mismatch" }

      - uses: actions/upload-artifact@v4
        with:
          name: pythontdx-windows-x64-${{ github.run_id }}
          path: |
            release/*/pythontdx-*-setup.exe
            release/*/pythontdx-*-portable.exe
            release/*/pythontdx-*-win-x64.zip
            release/*/*.sha256
            release/*/pythontdx-selfsigned.cer
          if-no-files-found: error
          retention-days: 14
