# 只补 Windows 绿色 zip 到已有 Release，不重打 Linux/macOS。
#
# 触发：workflow_dispatch（选择 tag，默认 v1.1.0）
# 产物：pythontdx-<version>-win-x64.zip + .sha256 + pythontdx-selfsigned.cer
# 不会改动已有的 setup/portable/dmg/AppImage 资产。
name: release-windows-zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Windows zip to
        required: true
        default: v1.1.0

permissions:
  contents: write

concurrency:
  group: release-windows-zip-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Build Windows unpacked
        run: |
          npm run build:python
          npm run build
          npx electron-builder --win dir --publish never

      - name: Sign Windows (self-signed, best effort)
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/sign-win.ps1

      - name: Create and verify green zip
        shell: powershell
        run: npm run build:win:zip

      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/*/pythontdx-*-win-x64.zip
            release/*/pythontdx-*-win-x64.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
