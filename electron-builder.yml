appId: com.pythontdx.app
productName: pythontdx
copyright: Copyright © 2026 River

directories:
  buildResources: build
  output: release/${version}

# 只打包「运行时真正需要」的东西：out/ 产物 + package.json + 生产依赖
# LICENSE 必须随包分发（GPL-3.0-or-later），不能只留在仓库里。
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - '!**/*.{md,map,ts,tsx}'
  - '!node_modules/**/{test,__tests__,docs,example,examples}/**'

asarUnpack:
  - resources/**

# Python 行情桥接进程：build:python 会产出 python/dist/tdx-bridge
# （Windows 是 tdx-bridge.exe），这里整个目录复制到 resources/tdx-bridge/
extraResources:
  - from: python/dist
    to: tdx-bridge
    filter:
      - 'tdx-bridge*'
  # 统一传输后由 Python 服务托管同一份 Web 页面；Electron 不再 loadFile。
  - from: out/web
    to: web
  # 工程内置的 Windows 客户端主站快照；与 sidecar 同目录，便于离线/无客户端环境使用。
  - from: python/connect.cfg
    to: tdx-bridge/connect.cfg

# 生产依赖里如果有原生模块，这里开 rebuild；纯 JS 项目关掉可以显著加速
npmRebuild: false

win:
  executableName: pythontdx
  icon: build/icon.ico
  target:
    # nsis     → 传统安装包（可以选择安装目录、生成快捷方式）
    # portable → 单文件绿色版：一个 exe，双击即用，不写注册表、不装到系统里
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

portable:
  artifactName: ${name}-${version}-portable.${ext}
  # 固定解压目录名，好处是路径可预期（%TEMP%\pythontdxPortable），
  # 排查问题和手工清理都方便。
  #
  # 实测（electron-builder 26 / 2026-09）：**它不会带来跨次启动的复用加速** ——
  # 单文件 exe 每次启动都要把约 368MB 解压到该目录，正常退出时清理，
  # 被强杀时会残留。实测从双击到界面就绪约 2 秒，安装版约 1 秒
  # （连续多次测量，见 CHANGELOG 的实测数据表）。
  unpackDirName: pythontdxPortable
  # 不需要管理员权限：便携版不应该触发 UAC
  requestExecutionLevel: user

mac:
  # 没有 .icns 时 electron-builder 会自动用这张 512×512 的 PNG 转换生成
  icon: build/icon.png
  category: public.app-category.finance
  # 免费分发方案：整包 ad-hoc 签名（不需要 Developer ID / 付费账号）。
  #
  # 不签名的包从浏览器下载后，macOS 会报「已损坏，无法打开」——没有「仍要打开」
  # 入口，用户只能删掉；ad-hoc 签名后变成「Apple 无法验证…」，可以在
  # 系统设置 → 隐私与安全性里放行，或 `xattr -dr com.apple.quarantine`。
  # 它仍然不是可信签名，不能消除首次打开的警告；要彻底消除必须 Developer ID +
  # 公证（需要付费账号），届时把 identity 改回自动发现、hardenedRuntime 改 true。
  identity: '-'
  # ad-hoc + hardened runtime 需要 disable-library-validation entitlement，否则
  # Electron 预签名的 Framework 会被 library validation 拒绝；这里不需要公证，
  # 直接关掉 hardened runtime 最省事。
  hardenedRuntime: false
  target:
    # macOS 只交付 Apple Silicon（arm64）。2026-11-02 用户明确不需要支持 Intel。
    # sidecar 是 Nuitka 单文件，只能由本机 Python 编译出本机架构；在 Intel 机器上
    # 会得到「arm64 外壳 + x64 sidecar」，before-pack.cjs 会直接拦下，不产坏包。
    - target: dmg
      arch: [arm64]

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Finance
  maintainer: River
  target:
    - AppImage
    - deb

beforePack: scripts/build/before-pack.cjs
